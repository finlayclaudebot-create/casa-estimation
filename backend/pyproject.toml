[project]
name = "casa-estimation-backend"
version = "0.1.0"
description = "Australian Building Takeoff Automation - backend service"
requires-python = ">=3.11"
readme = "../README.md"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.2",
    "psycopg[binary]>=3.2.0",
    "celery>=5.4.0",
    "redis>=5.0.7",
    "python-multipart>=0.0.9",
    "structlog>=24.4.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "pillow>=10.4.0",
    "opencv-python-headless>=4.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "types-redis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle, pyflakes
    "I",                   # isort
    "B",                   # bugbear
    "UP",                  # pyupgrade
    "SIM",                 # simplify
    "RUF",                 # ruff
    "N",                   # pep8-naming
    "ARG",                 # unused arguments
]
ignore = [
    "E501",  # line too long; handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
packages = ["app"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = [
    "fitz",
    "fitz.*",
    "pdfplumber",
    "pdfplumber.*",
    "cv2",
    "cv2.*",
    "celery",
    "celery.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
